[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tkai"
version = "11.0.0"
description = "TKAI TikTok Cloud Control Platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "jinja2>=3.1",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "tomli>=2.0; python_version < '3.11'",
    "typer>=0.12",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
server = ["fastapi>=0.110", "pydantic>=2.0", "uvicorn>=0.30"]
postgres = ["SQLAlchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.1"]
dev = [
    "black>=24.0",
    "mypy==1.18.2",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
    "vulture>=2.11",
]

[project.scripts]
tkai = "tkai.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
# V3.0 compatibility baseline:
# include = ["tkai*", "studio*", "enterprise*", "cloud*", "marketplace*", "server*"]
include = ["tkai*", "studio*", "enterprise*", "cloud*", "marketplace*", "server*", "applications*", "knowledge_platform*", "knowledge_graph*", "workflow_platform*", "app_store*", "orchestrator*", "memory_engine*", "reasoning_engine*", "collaboration*", "governance*", "data_platform*", "model_platform*", "security_platform*", "operations_platform*", "automation_platform*", "integration_platform*", "api_management*", "event_streaming*", "integration_hub*", "digital_twin*", "business_intelligence*", "command_center*", "decision_intelligence*", "autonomous_operations*", "multi_agent*", "cognitive_architecture*", "autonomous_intelligence*", "self_evolving*", "self_optimization*", "tiktok*", "local_runtime*"]
exclude = ["tests*", "benchmarks*"]

[tool.setuptools.package-data]
tkai = ["templates/default/README.md", "templates/default/template.json"]
studio = ["frontend/**", "assets/**", "docs/**"]
server = ["persistence/*.ini"]

[tool.setuptools.exclude-package-data]
studio = ["frontend/node_modules/**", "frontend/dist/**"]

[tool.setuptools.data-files]
"share/doc/tkai/marketplace" = [
    "docs/Marketplace.md",
    "docs/Publisher.md",
    "docs/PackageCatalog.md",
    "docs/Publication.md",
    "docs/Registry.md",
