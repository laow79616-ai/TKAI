"share/doc/tkai/release" = [
    "docs/ReleaseValidation.md",
    "docs/release/V3.0.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["core"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.vulture]
paths = ["src/tkai/v8"]
min_confidence = 100
# Protocol declarations intentionally name parameters for implementer clarity.
ignore_names = ["kernel"]

[tool.mypy]
python_version = "3.10"
files = ["src/tkai"]
incremental = false
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
