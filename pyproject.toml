[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tkai"
version = "1.3.0"
description = "TKAI AI Software Factory"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "jinja2>=3.1",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
dev = [
    "black>=24.0",
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[project.scripts]
tkai = "tkai.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["tkai*", "studio*", "enterprise*", "cloud*", "marketplace*"]
exclude = ["tests*", "benchmarks*"]

[tool.setuptools.package-data]
tkai = ["templates/default/README.md", "templates/default/template.json"]
studio = ["frontend/**", "assets/**", "docs/**"]

[tool.setuptools.data-files]
"share/doc/tkai/marketplace" = [
    "docs/Marketplace.md",
    "docs/Publisher.md",
    "docs/PackageCatalog.md",
    "docs/Publication.md",
    "docs/Registry.md",
    "docs/Resolver.md",
    "docs/Installer.md",
    "docs/InstallerReliability.md",
    "docs/Verification.md",
    "docs/Trust.md",
    "docs/ArchitectureReview.md",
]
"share/doc/tkai/marketplace/release" = [
    "docs/release/marketplace-v5-rc1.md",
    "docs/release/marketplace-v5-rc2.md",
    "docs/release/marketplace-v5-rc3.md",
]
"share/doc/tkai/marketplace/benchmarks" = [
    "docs/benchmarks/verification.md",
    "docs/benchmarks/verification.json",
    "docs/benchmarks/resolver.md",
    "docs/benchmarks/resolver.json",
    "docs/benchmarks/installer.md",
    "docs/benchmarks/installer.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["core"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
files = ["src/tkai"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
