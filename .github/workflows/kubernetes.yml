name: Kubernetes CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate YAML and Cloud Native contracts
        run: |
          python -m pip install pyyaml pytest
          python -m pytest tests/deployment/test_kubernetes_foundation.py
      - name: Helm lint
        run: helm lint deployment/helm/tkai
      - name: Render default and production manifests
        run: |
          helm template tkai deployment/helm/tkai --namespace tkai > /tmp/tkai.yaml
          helm template tkai deployment/helm/tkai --namespace tkai -f deployment/helm/tkai/values-production.yaml > /tmp/tkai-production.yaml
      - name: Validate required workload controls and no hardcoded secrets
        run: |
          grep -q "kind: StatefulSet" /tmp/tkai.yaml
          grep -q "kind: HorizontalPodAutoscaler" /tmp/tkai.yaml
          grep -q "readOnlyRootFilesystem: true" /tmp/tkai.yaml
          grep -q "startupProbe:" /tmp/tkai.yaml
          grep -q "resources:" /tmp/tkai.yaml
          ! grep -R -E 'password:[[:space:]]+[^{$<[:space:]]' deployment/helm deployment/kubernetes
