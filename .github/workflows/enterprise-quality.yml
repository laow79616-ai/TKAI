name: Enterprise Quality Gates
on:
  pull_request:
  push:
    branches: [main, develop, "release/**", "support/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: enterprise-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            dashboard/frontend/package-lock.json
            studio/frontend/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,server]" build pip-audit
      - run: npm --prefix dashboard/frontend ci
      - run: npm --prefix studio/frontend ci
      - run: python scripts/validate-enterprise.py
