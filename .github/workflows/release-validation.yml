name: Release Validation
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,server]" build pip-audit
      - run: python scripts/validate-enterprise.py --skip-frontends
      - uses: actions/upload-artifact@v4
        with:
          name: enterprise-validation
          path: artifacts/enterprise-validation.json
          if-no-files-found: error
          retention-days: 30
