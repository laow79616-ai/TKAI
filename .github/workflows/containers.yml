name: Container CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: tkai_ci
      POSTGRES_USER: tkai_ci
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_PORT: "5432"
      GRAFANA_ADMIN_USER: tkai_ci
      GRAFANA_ADMIN_PASSWORD: ci-only-grafana-password
      PROMETHEUS_RETENTION: 1d
      LOKI_RETENTION: 24h
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          test "$(docker compose config --services)" = "$(printf 'postgres\napi\ndashboard\nnginx')"
          docker compose -f docker-compose.yml -f docker-compose.production.yml config --quiet
          test "$(docker compose -f docker-compose.yml -f docker-compose.production.yml config --services)" = "$(printf 'postgres\napi\ndashboard\nnginx')"
          docker compose -f docker-compose.yml -f docker-compose.observability.yml config --quiet
          test "$(docker compose -f docker-compose.yml -f docker-compose.observability.yml config --services | sort)" = "$(printf 'postgres\napi\ndashboard\nnginx\nprometheus\ngrafana\nloki\nalloy\nalertmanager\npostgres-exporter\nnginx-exporter' | sort)"
          docker compose -f docker-compose.yml -f docker-compose.production.yml -f docker-compose.observability.yml config --quiet

  images:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            dockerfile: Dockerfile.api
            image: tkai-api
            artifact: tkai-api-image
          - name: Dashboard
            dockerfile: Dockerfile.dashboard
            image: tkai-dashboard
            artifact: tkai-dashboard-image
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: ${{ matrix.image }}:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/${{ matrix.artifact }}.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/${{ matrix.artifact }}.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
