services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - marketplace-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MIGRATE: ${POSTGRES_MIGRATE:-true}
      POSTGRES_WAIT_ATTEMPTS: ${POSTGRES_WAIT_ATTEMPTS:-30}
      POSTGRES_WAIT_INTERVAL_SECONDS: ${POSTGRES_WAIT_INTERVAL_SECONDS:-1}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
    expose:
      - "${API_PORT:-8000}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; from os import environ; urlopen('http://localhost:' + environ['API_PORT'] + '/health')\""]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    expose:
      - "4173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4173').then(() => process.exit(0)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  gateway:
    image: nginx:1.27-alpine
    profiles: ["development"]
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deployment/nginx:/etc/nginx/tkai:ro
      - ./deployment/nginx/http.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      dashboard:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  gateway-https:
    image: nginx:1.27-alpine
    profiles: ["production"]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deployment/nginx:/etc/nginx/tkai:ro
      - ./deployment/nginx/https.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERTIFICATE_PATH:-./certs/tls.crt}:/etc/nginx/tls/tls.crt:ro
      - ${TLS_PRIVATE_KEY_PATH:-./certs/tls.key}:/etc/nginx/tls/tls.key:ro
    depends_on:
      api:
        condition: service_healthy
      dashboard:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

volumes:
  marketplace-postgres-data:
