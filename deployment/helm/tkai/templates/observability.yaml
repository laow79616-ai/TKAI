{{- if .Values.observability.enabled }}
apiVersion: v1
kind: ConfigMap
metadata: {name: tkai-prometheus}
data:
  prometheus.yml: |
    global: {scrape_interval: 30s}
    rule_files: [/etc/prometheus/alerts.yml]
    scrape_configs:
      - job_name: tkai-api
        kubernetes_sd_configs: [{role: endpoints}]
        relabel_configs:
          - {source_labels: [__meta_kubernetes_service_name], regex: tkai-api, action: keep}
  alerts.yml: |
    groups:
      - name: tkai-kubernetes
        rules:
          - alert: TKAIWorkloadUnavailable
            expr: kube_deployment_status_replicas_available{deployment=~"tkai-.*"} < 1
            for: 5m
          - alert: TKAIPodRestarting
            expr: increase(kube_pod_container_status_restarts_total{pod=~"tkai-.*"}[15m]) > 3
          - alert: TKAIDeploymentReplicaMismatch
            expr: kube_deployment_spec_replicas{deployment=~"tkai-.*"} != kube_deployment_status_replicas_available{deployment=~"tkai-.*"}
            for: 10m
---
{{- range $name := list "prometheus" "grafana" "loki" "alertmanager" }}
apiVersion: apps/v1
kind: Deployment
metadata: {name: tkai-{{ $name }}}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: tkai, app.kubernetes.io/component: {{ $name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: tkai, app.kubernetes.io/component: {{ $name }}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: {{ $name }}
          image: {{ (index $.Values.observability $name).image | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          ports: [{name: http, containerPort: {{ if eq $name "prometheus" }}9090{{ else if eq $name "grafana" }}3000{{ else if eq $name "loki" }}3100{{ else }}9093{{ end }}}]
          readinessProbe:
            tcpSocket: {port: http}
          livenessProbe:
            tcpSocket: {port: http}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata: {name: tkai-{{ $name }}}
spec:
  selector: {app.kubernetes.io/name: tkai, app.kubernetes.io/component: {{ $name }}}
  ports: [{name: http, port: {{ if eq $name "prometheus" }}9090{{ else if eq $name "grafana" }}3000{{ else if eq $name "loki" }}3100{{ else }}9093{{ end }}}]
---
{{- end }}
{{- if .Values.observability.serviceMonitor }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: {name: tkai-api}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: tkai, app.kubernetes.io/component: api}
  endpoints: [{port: http, path: /metrics}]
{{- end }}
{{- end }}
