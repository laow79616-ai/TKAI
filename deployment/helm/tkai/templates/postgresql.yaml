{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata: {name: tkai-postgresql}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: tkai, app.kubernetes.io/component: postgresql}
  ports: [{name: postgresql, port: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: tkai-postgresql}
spec:
  serviceName: tkai-postgresql
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: tkai, app.kubernetes.io/component: postgresql}
  template:
    metadata:
      labels: {app.kubernetes.io/name: tkai, app.kubernetes.io/component: postgresql}
      annotations:
        tkai.io/backup-integration: "configure an external backup controller"
    spec:
      securityContext: {runAsNonRoot: true, fsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: postgresql
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          env:
            - {name: POSTGRES_DB, value: {{ .Values.postgresql.database | quote }}}
            - {name: POSTGRES_USER, value: {{ .Values.postgresql.user | quote }}}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.postgresql.existingSecret }}, key: {{ .Values.postgresql.secretKey }}}
          ports: [{name: postgresql, containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", {{ .Values.postgresql.user | quote }}]}
          livenessProbe:
            tcpSocket: {port: postgresql}
          startupProbe:
            exec: {command: ["pg_isready", "-U", {{ .Values.postgresql.user | quote }}]}
            failureThreshold: 30
          resources: {{- toYaml .Values.postgresql.resources | nindent 12 }}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.postgresql.persistence.storageClass }}
        storageClassName: {{ .Values.postgresql.persistence.storageClass }}
        {{- end }}
        resources:
          requests: {storage: {{ .Values.postgresql.persistence.size }}}
{{- end }}
