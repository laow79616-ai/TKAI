{{- range $name := list "api" "dashboard" }}
{{- $component := index $.Values $name }}
{{- if $component.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tkai-{{ $name }}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: tkai-{{ $name }}}
  minReplicas: {{ $component.autoscaling.minReplicas }}
  maxReplicas: {{ $component.autoscaling.maxReplicas }}
  behavior:
    scaleUp: {stabilizationWindowSeconds: 60}
    scaleDown: {stabilizationWindowSeconds: 300}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ $component.autoscaling.cpu }}}
    - type: Resource
      resource:
        name: memory
        target: {type: Utilization, averageUtilization: {{ $component.autoscaling.memory }}}
---
{{- end }}
{{- end }}
