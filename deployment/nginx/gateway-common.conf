gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types
    application/javascript
    application/json
    application/xml
    image/svg+xml
    text/css
    text/plain
    text/xml;

include /etc/nginx/tkai/security-headers.conf;

location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "healthy\n";
}

location = /nginx-status {
    access_log off;
    stub_status;
    allow 127.0.0.1;
    allow 172.16.0.0/12;
    deny all;
}

location = /docs {
    proxy_pass http://api:8000;
    include /etc/nginx/tkai/proxy-common.conf;
}

location = /openapi.json {
    proxy_pass http://api:8000;
    include /etc/nginx/tkai/proxy-common.conf;
}

location = /health {
    proxy_pass http://api:8000;
    include /etc/nginx/tkai/proxy-common.conf;
}

location = /ready {
    proxy_pass http://api:8000/health/ready;
    include /etc/nginx/tkai/proxy-common.conf;
}

location = /live {
    proxy_pass http://api:8000/health/live;
    include /etc/nginx/tkai/proxy-common.conf;
}

location = /metrics {
    proxy_pass http://api:8000;
    include /etc/nginx/tkai/proxy-common.conf;
}

location /api/ {
    proxy_pass http://api:8000/;
    include /etc/nginx/tkai/proxy-common.conf;
}

location ~* \.(?:css|js|mjs|png|jpe?g|gif|ico|svg|webp|woff2?|ttf|map)$ {
    proxy_pass http://dashboard:4173;
    include /etc/nginx/tkai/proxy-common.conf;
    proxy_hide_header Cache-Control;
    include /etc/nginx/tkai/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location / {
    proxy_pass http://dashboard:4173;
    include /etc/nginx/tkai/proxy-common.conf;
}
