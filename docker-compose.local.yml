name: tkai-local
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: sqlite:////runtime/data/tkai-local.db
      POSTGRES_MIGRATE: "false"
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - tkai-local-runtime:/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
      args:
        VITE_API_BASE_URL: http://127.0.0.1:8000
    ports:
      - "127.0.0.1:4173:4173"
    depends_on:
      api:
        condition: service_healthy
    command: ["npm", "exec", "vite", "preview", "--", "--host", "0.0.0.0", "--port", "4173"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6

  studio:
    build:
      context: .
      dockerfile: Dockerfile.studio
    ports:
      - "127.0.0.1:4174:4174"
    depends_on:
      api:
        condition: service_healthy
    command: ["npm", "exec", "vite", "preview", "--", "--host", "0.0.0.0", "--port", "4174"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4174').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  tkai-local-runtime:
